<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Join NumberPort to prepare for number orders, rentals and account management.">
    <title>Create your account | NumberPort</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body data-page="register">
    <div id="siteHeader"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="../index.html">Home</a> / Create your account</div><span
                    class="eyebrow">NumberPort</span>
                <h1 style="margin-top:15px">Create your account</h1>
                <p>Join NumberPort to prepare for number orders, rentals and account management.</p>
            </div>
        </section>
        <section class="section" style="padding-top:18px">
            <div class="container">
                <div class="auth-wrap">
                    <form class="card auth-card" data-auth-form="register"><span class="eyebrow">Get started</span>
                        <h1 style="margin-top:15px">Create account</h1>
                        <p>It only takes a moment to get started.</p>
                        <div class="field"><label>Full name</label><input name="fullName" autocomplete="name" required
                                placeholder="Your full name"></div>
                        <div class="field"><label>Email address</label><input name="email" type="email"
                                autocomplete="email" required placeholder="you@example.com"></div>
                        <div class="field"><label>Password</label><input id="regPassword" name="password"
                                type="password" autocomplete="new-password" minlength="8" required
                                placeholder="At least 8 characters"></div>
                        <div class="field"><label>Confirm password</label><input name="confirmPassword" type="password"
                                autocomplete="new-password" minlength="8" required placeholder="Re-enter password">
                        </div>
                        <div class="form-foot"><label><input type="checkbox" required> I agree to the <a
                                    class="text-link" href="terms.html">terms</a> and <a class="text-link"
                                    href="privacy.html">privacy policy</a>.</label></div><button class="btn btn-primary"
                            type="submit">Create account</button>
                        <p style="text-align:center;margin-top:18px">Already registered? <a class="text-link"
                                href="login.html">Sign in</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
</body>

</html>
