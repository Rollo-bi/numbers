<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Manage your personal and account information.">
    <title>Profile settings | NumberPort</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body data-page="profile">
    <div id="siteHeader"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="../index.html">Home</a> / Profile settings</div><span
                    class="eyebrow">NumberPort</span>
                <h1 style="margin-top:15px">Profile settings</h1>
                <p>Manage your personal and account information.</p>
            </div>
        </section>
        <section class="section" style="padding-top:18px">
            <div class="container">
                <div class="dashboard-layout">
                    <aside class="side-nav"><a href="dashboard.html">▦ Overview</a><a href="my-numbers.html">☎ My
                            numbers</a><a href="orders.html">▤ Orders</a><a href="wallet.html">◈ Wallet</a><a
                            href="transactions.html">⇄ Transactions</a><a class="active" href="profile.html">◎
                            Profile</a><a href="support.html">? Support</a></aside>
                    <section class="dash-main">
                        <h2>Profile</h2>
                        <p class="muted">Your profile will be loaded from Firebase after authentication is connected.
                        </p>
                        <form class="card" data-demo-form
                            data-message="Profile form preview only. Firebase profile updates will be enabled later."
                            style="max-width:650px">
                            <div class="field"><label>Full name</label><input placeholder="Your full name"></div>
                            <div class="field"><label>Email address</label><input type="email"
                                    placeholder="you@example.com" disabled></div>
                            <div class="field"><label>Phone number (optional)</label><input placeholder="+254..."></div>
                            <button class="btn btn-primary">Save changes</button>
                        </form>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
</body>

</html>
