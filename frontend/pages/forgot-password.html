<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Enter the email address associated with your account.">
    <title>Reset your password | NumberPort</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body data-page="forgot-password">
    <div id="siteHeader"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="../index.html">Home</a> / Reset your password</div><span
                    class="eyebrow">NumberPort</span>
                <h1 style="margin-top:15px">Reset your password</h1>
                <p>Enter the email address associated with your account.</p>
            </div>
        </section>
        <section class="section" style="padding-top:18px">
            <div class="container">
                <div class="auth-wrap">
                    <form class="card auth-card" data-auth-form="reset"><span class="eyebrow">Account recovery</span>
                        <h1 style="margin-top:15px">Reset password</h1>
                        <p>We'll help you get back into your account.</p>
                        <div class="field"><label>Email address</label><input name="email" type="email"
                                autocomplete="email" required placeholder="you@example.com"></div><button
                            class="btn btn-primary" type="submit">Send reset instructions</button>
                        <p style="text-align:center;margin-top:18px"><a class="text-link" href="login.html">Back to sign
                                in</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
</body>

</html>
