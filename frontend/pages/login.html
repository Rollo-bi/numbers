<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Sign in to access your NumberPort dashboard.">
    <title>Welcome back | NumberPort</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body data-page="login">
    <div id="siteHeader"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="../index.html">Home</a> / Welcome back</div><span
                    class="eyebrow">NumberPort</span>
                <h1 style="margin-top:15px">Welcome back</h1>
                <p>Sign in to access your NumberPort dashboard.</p>
            </div>
        </section>
        <section class="section" style="padding-top:18px">
            <div class="container">
                <div class="auth-wrap">
                    <form class="card auth-card" data-auth-form="login"><span class="eyebrow">Customer account</span>
                        <h1 style="margin-top:15px">Welcome back</h1>
                        <p>Sign in to manage your numbers and orders.</p>
                        <div class="field"><label>Email address</label><input name="email" type="email"
                                autocomplete="email" required placeholder="you@example.com"></div>
                        <div class="field"><label>Password</label><input id="loginPassword" name="password"
                                type="password" autocomplete="current-password" required
                                placeholder="Your password"><button type="button" class="btn btn-quiet"
                                data-password-toggle="#loginPassword">Show password</button></div>
                        <div class="form-foot"><label><input type="checkbox"> Remember me</label><a class="text-link"
                                href="forgot-password.html">Forgot password?</a></div><button class="btn btn-primary"
                            type="submit">Sign in</button>
                        <div class="divider-text">New to NumberPort?</div>
                        <p style="text-align:center"><a class="text-link" href="register.html">Create an account</a></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
</body>

</html>
