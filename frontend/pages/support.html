<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Get help with account access, orders and number services.">
    <title>Customer support | NumberPort</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../js/app.js"></script>
</head>

<body data-page="support">
    <div id="siteHeader"></div>
    <main>
        <section class="page-hero">
            <div class="container">
                <div class="breadcrumbs"><a href="../index.html">Home</a> / Customer support</div><span
                    class="eyebrow">NumberPort</span>
                <h1 style="margin-top:15px">Customer support</h1>
                <p>Get help with account access, orders and number services.</p>
            </div>
        </section>
        <section class="section" style="padding-top:18px">
            <div class="container">
                <div class="dashboard-layout">
                    <aside class="side-nav"><a href="dashboard.html">▦ Overview</a><a href="my-numbers.html">☎ My
                            numbers</a><a href="orders.html">▤ Orders</a><a href="wallet.html">◈ Wallet</a><a
                            href="transactions.html">⇄ Transactions</a><a href="profile.html">◎ Profile</a><a
                            class="active" href="support.html">? Support</a></aside>
                    <section class="dash-main">
                        <h2>Support centre</h2>
                        <p class="muted">Send a support request. Your ticket will be saved securely for administrator
                            review.</p>
                        <form class="card" data-support-form style="max-width:700px">
                            <div class="field"><label>Topic</label><select name="topic">
                                    <option>Order issue</option>
                                    <option>Number or SMS issue</option>
                                    <option>Account access</option>
                                    <option>Payment question</option>
                                    <option>Other</option>
                                </select></div>
                            <div class="field"><label>Order reference (optional)</label><input name="orderReference"
                                    placeholder="Order ID (optional)"></div>
                            <div class="field"><label>Message</label><textarea name="message" rows="5" required
                                    minlength="10" placeholder="Describe the issue"></textarea></div><button
                                class="btn btn-primary" type="submit">Submit support request</button>
                        </form>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <div id="siteFooter"></div>
</body>

</html>
